# Cloud Run management tasks for dev environment
#
# Quick start:
#   mise //infra/terraform:dev:bootstrap   — create infra + push images (one command)
#   mise //infra/terraform:dev:destroy     — tear down everything ($0)
#
# NOTE: Cloud Run Services (ingestion, state-manager, visualizer) and the
# path-optimizer Job are deployed by the CD pipeline (GitHub Actions on push to main).
# After a bootstrap, either push to main or re-run the CD workflow manually from
# GitHub Actions to deploy them !

[env]
PROJECT_ID = "drone-fleet-optimizer-dev"
REGION = "europe-west1"



[tasks."dev:bootstrap"]
description = "Full dev setup: terraform init → registry → push images → full apply"
dir = "{{config_root}}/environments/dev"
run = """
set -e

echo "Terraform init :"
terraform init

echo ""
echo "Create Artifact Registry :"
terraform apply -target=google_artifact_registry_repository.drone_fleet -auto-approve

echo ""
echo "Build and push Docker images :"
REPO_ROOT="$(git rev-parse --show-toplevel)"
REGISTRY="${REGION}-docker.pkg.dev"
IMAGE_BASE="${REGISTRY}/${PROJECT_ID}/drone-fleet"
SHORT_SHA=$(git rev-parse --short HEAD)

gcloud auth configure-docker "$REGISTRY" --quiet

IMAGES=(
  "ingestion:services/ingestion/Dockerfile:dev"
  "state-manager:services/state_manager/Dockerfile:"
  "path-optimizer:services/path_optimizer/Dockerfile:dev"
  "visualizer:services/visualizer/Dockerfile:"
  "simulator:services/simulators/Dockerfile:dev"
  "seed-firestore:infra/scripts/Dockerfile.seed:"
)

cd "$REPO_ROOT"
for entry in "${IMAGES[@]}"; do
  IFS=':' read -r name dockerfile env_arg <<< "$entry"
  echo ""
  echo "--- Building $name ---"

  BUILD_ARGS=""
  if [ -n "$env_arg" ]; then
    BUILD_ARGS="--build-arg ENVIRONMENT=$env_arg"
  fi

  docker build -f "$dockerfile" $BUILD_ARGS \
    -t "$IMAGE_BASE/$name:$SHORT_SHA" \
    -t "$IMAGE_BASE/$name:latest" .

  docker push "$IMAGE_BASE/$name:$SHORT_SHA"
  docker push "$IMAGE_BASE/$name:latest"
  echo "  -> $name pushed"
done

echo ""
echo "Terraform apply (full with all images) :"
cd "$OLDPWD"
terraform apply -auto-approve

echo ""
echo "Bootstrap complete!"
echo "Images: $IMAGE_BASE (tag: $SHORT_SHA)"
echo ""
echo "Next steps:"
echo "  - Push to main (or re-run CD from GitHub Actions) to deploy Cloud Run Services"
echo "  - Then: mise //infra/terraform:dev:seed"
echo "  - Then: mise //infra/terraform:dev:simulate"
"""

[tasks."dev:launch"]
description = "Launch all services and jobs (scale up, start schedulers) by terraform apply"
dir = "{{config_root}}/environments/dev"
run = """
terraform apply
"""

[tasks."dev:destroy"]
description = "Destroy all services and jobs (scale down, stop schedulers) by terraform destroy"
dir = "{{config_root}}/environments/dev"
run = "terraform destroy"

[tasks."dev:up"]
description = "Start all Cloud Run services (restore normal scaling)"
run = """
echo "Restoring Cloud Run services..."

gcloud run services update ingestion \
  --region $REGION --project $PROJECT_ID \
  --min-instances 0 --max-instances 2 --quiet

gcloud run services update states-manager \
  --region $REGION --project $PROJECT_ID \
  --min-instances 1 --max-instances 3 --quiet

gcloud run services update visualizer \
  --region $REGION --project $PROJECT_ID \
  --min-instances 0 --max-instances 2 --quiet

echo "Resuming Cloud Scheduler job..."
gcloud scheduler jobs resume trigger-path-optimizer \
  --location $REGION --project $PROJECT_ID --quiet 2>/dev/null || true

echo "All services are UP."
"""

[tasks."dev:down"]
description = "Stop all Cloud Run services (scale to zero, costs $0)"
run = """
echo "Scaling down Cloud Run services to zero..."

gcloud run services update ingestion \
  --region $REGION --project $PROJECT_ID \
  --max-instances 0 --quiet 2>/dev/null || true

gcloud run services update state-manager \
  --region $REGION --project $PROJECT_ID \
  --min-instances 0 --max-instances 0 --quiet 2>/dev/null || true

gcloud run services update visualizer \
  --region $REGION --project $PROJECT_ID \
  --max-instances 0 --quiet 2>/dev/null || true

echo "Pausing Cloud Scheduler job..."
gcloud scheduler jobs pause trigger-path-optimizer \
  --location $REGION --project $PROJECT_ID --quiet 2>/dev/null || true

echo "All services are DOWN. Cost = $0."
"""

[tasks."dev:status"]
description = "Show status of all Cloud Run services and jobs"
run = """
echo "=== Cloud Run Services ==="
gcloud run services list --region $REGION --project $PROJECT_ID \
  --format="table(name,status.url,status.conditions[0].status,spec.template.spec.containerConcurrency,spec.template.metadata.annotations.'autoscaling.knative.dev/minScale',spec.template.metadata.annotations.'autoscaling.knative.dev/maxScale')" \
  2>/dev/null || echo "No services found"

echo ""
echo "=== Cloud Run Jobs ==="
gcloud run jobs list --region $REGION --project $PROJECT_ID \
  --format="table(name,status.conditions[0].status,status.latestCreatedExecution.name)" \
  2>/dev/null || echo "No jobs found"

echo ""
echo "=== Cloud Scheduler ==="
gcloud scheduler jobs list --location $REGION --project $PROJECT_ID \
  --format="table(name,state,schedule,lastAttemptTime)" \
  2>/dev/null || echo "No scheduler jobs found"
"""

[tasks."plan"]
description = "Run terraform plan for dev environment"
dir = "{{config_root}}/environments/dev"
run = "terraform plan"

[tasks."apply"]
description = "Run terraform apply for dev environment"
dir = "{{config_root}}/environments/dev"
run = "terraform apply"

[tasks."init"]
description = "Run terraform init for dev environment"
dir = "{{config_root}}/environments/dev"
run = "terraform init"

[tasks."dev:push-images"]
description = "Build and push all Docker images to Artifact Registry (called by dev:bootstrap, can also be run standalone)"
dir = "{{config_root}}/../.."
run = """
set -e

REGISTRY="${REGION}-docker.pkg.dev"
IMAGE_BASE="${REGISTRY}/${PROJECT_ID}/drone-fleet"
SHORT_SHA=$(git rev-parse --short HEAD)

echo "Authenticating Docker with Artifact Registry..."
gcloud auth configure-docker "$REGISTRY" --quiet

IMAGES=(
  "ingestion:services/ingestion/Dockerfile:dev"
  "state-manager:services/state_manager/Dockerfile:"
  "path-optimizer:services/path_optimizer/Dockerfile:dev"
  "visualizer:services/visualizer/Dockerfile:"
  "simulator:services/simulators/Dockerfile:dev"
  "seed-firestore:infra/scripts/Dockerfile.seed:"
)

for entry in "${IMAGES[@]}"; do
  IFS=':' read -r name dockerfile env_arg <<< "$entry"
  echo ""
  echo "=== Building $name ==="

  BUILD_ARGS=""
  if [ -n "$env_arg" ]; then
    BUILD_ARGS="--build-arg ENVIRONMENT=$env_arg"
  fi

  docker build -f "$dockerfile" $BUILD_ARGS \
    -t "$IMAGE_BASE/$name:$SHORT_SHA" \
    -t "$IMAGE_BASE/$name:latest" .

  echo "Pushing $name..."
  docker push "$IMAGE_BASE/$name:$SHORT_SHA"
  docker push "$IMAGE_BASE/$name:latest"
done

echo ""
echo "All images pushed to $IMAGE_BASE (tag: $SHORT_SHA + latest)"
"""

[tasks."dev:seed"]
description = "Run seed-firestore Cloud Run Job (one-shot, populates Firestore)"
run = """
echo "Executing seed-firestore Cloud Run Job..."
gcloud run jobs execute seed-firestore \
  --region $REGION --project $PROJECT_ID --wait
echo "Seeding complete."
"""

[tasks."dev:simulate"]
description = "Run simulator Cloud Run Job (one-shot, sends telemetry + orders)"
run = """
echo "Executing simulator Cloud Run Job..."
gcloud run jobs execute simulator \
  --region $REGION --project $PROJECT_ID --wait
echo "Simulation complete."
"""
