repos:
  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Prevent committing large files
      - id: check-added-large-files
        args: ['--maxkb=6000']

      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: '^shared/java/src/main/java/com/dronefleet/shared/models/'
      - id: trailing-whitespace
        exclude: '^shared/java/src/main/java/com/dronefleet/shared/models/'

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: '^shared/python/src/dronefleet_shared/models/dronefleet/'

  # Terraform formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate


  # Protobuf schema sync check
  - repo: local
    hooks:
      - id: proto-sync-check
        name: Check proto-generated models are up to date
        entry: bash -c 'mise run //shared/proto:generate && git diff --exit-code -- shared/java/src/main/java/com/dronefleet/shared/models/ shared/python/src/dronefleet_shared/models/ shared/ts/src/schemas/'
        language: system
        files: '\.(proto|java|py|ts)$'
        pass_filenames: false
