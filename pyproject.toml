[project]
name = "dronefleet-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.126.0",
    "google-cloud-pubsub>=2.33.0",
    "google-cloud-firestore>=2.19.0",
    "kafka-python>=2.3.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.38.0",
    "structlog>=24.1.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "types-requests>=2.32.0",
    "ortools>=9.8.3296",
    "httpx>=0.27.0",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "kafka.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]
