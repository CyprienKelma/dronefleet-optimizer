[project]
name = "dronefleet-messaging"
version = "0.1.0"
description = "Shared messaging library for DroneFleet"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-pubsub>=2.0.0",
    "confluent-kafka>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronefleet_messaging"]
