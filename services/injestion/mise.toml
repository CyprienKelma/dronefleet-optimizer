# injestion module tasks

[tasks.dev]
description = "Run injestion in development mode"
run = "uv run fastapi dev src/injestion/main.py"
env = { ENVIRONMENT = "local" }

[tasks.lint]
description = "Lint Python code with ruff and mypy"
run = ["uv run ruff check .", "uv run mypy ."]

[tasks.format]
description = "Format Python code with black"
run = "uv run black ."

[tasks.build]
description = "Build Docker image for injestion"
dir = "{{env.MISE_PROJECT_ROOT}}"
run = "docker build -t injestion:local -f services/injestion/Dockerfile ."
