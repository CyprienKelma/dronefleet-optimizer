services:

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=drone-project-dev --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    networks:
      - drone-network

  # Service éphémère qui configure les topics au démarrage
  pubsub-init:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./create_topics.py:/app/create_topics.py
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PROJECT_ID: drone-project-dev
    command: >
      bash -c "pip install google-cloud-pubsub && python create_topics.py"
    depends_on:
      - pubsub-emulator
    networks:
      - drone-network

  ingestion-api:
    build:
      context: ../../
      dockerfile: src/ingestion-api/Dockerfile
    environment:
      # env variable that determines which .env file to load
      # global_config.py will read this and load config/dev.env
      ENVIRONMENT: dev
      
      # pub/sub emulator config
      # the Google SDK ignores real GCP auth with this variable
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      
      # DEPLOYMENT_STRATEGY and other config values are loaded from config/dev.env
      # via pydantic_settings in global_config.py
    depends_on:
      - pubsub-emulator
      - pubsub-init
    ports:
      - "8000:8000"
    networks:
      - drone-network

  # state-manager:
  #   build:
  #     context: ../../src/state-manager
  #     dockerfile: Dockerfile
  #   environment:
  #     PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
  #     SPRING_CLOUD_GCP_PROJECT_ID: drone-project-dev
  #   depends_on:
  #     - pubsub-emulator
  #   networks:
  #     - drone-network

networks:
  drone-network:
    driver: bridge
