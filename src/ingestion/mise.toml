# ingestion module tasks

[tasks.dev]
description = "Run ingestion in development mode"
run = "uv run fastapi dev main.py"
env = { ENVIRONMENT = "local" }

[tasks.lint]
description = "Lint Python code with ruff and mypy"
run = ["uv run ruff check .", "uv run mypy ."]

[tasks.build]
description = "Build Docker image for ingestion"
dir = "{{env.MISE_PROJECT_ROOT}}"
run = "docker build -t ingestion:local -f src/ingestion/Dockerfile ."
