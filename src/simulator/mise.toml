# simulator module tasks

[tasks.run]
description = "Run the drone simulator"
dir = "{{env.MISE_PROJECT_ROOT}}"
run = "uv run python {{config_root}}/main.py"

[tasks.lint]
description = "Lint Python code with ruff and mypy"
run = ["uv run ruff check .", "uv run mypy ."]

[tasks.test]
dir = "{{env.MISE_PROJECT_ROOT}}"
run = "pwd"
