# visualizer module tasks (Bun + Vite)

[tools]
bun = "latest"

[tasks.dev]
description = "Run visualizer in development mode (mock data)"
run = "bun run vite"
env = { ENVIRONMENT = "local", VITE_DEBUG = "true" }

[tasks."dev:server"]
description = "Run SSE bridge server (connects to Pub/Sub)"
run = "bun run server/index.ts"
env = { ENVIRONMENT = "local", PUBSUB_EMULATOR_HOST = "localhost:8085" }

[tasks.build]
description = "Build visualizer for production"
run = "bun run vite build"

[tasks.preview]
description = "Preview production build"
run = "bun run vite preview"

[tasks.lint]
description = "Lint TypeScript code with biome"
run = "bunx @biomejs/biome check --write ."

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bun run tsc --noEmit"
