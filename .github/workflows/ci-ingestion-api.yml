name: CI - Ingestion API

on:
  pull_request:
    paths:
      - 'src/ingestion-api/**'
      - 'src/shared/**'
      - '.github/workflows/ci-ingestion-api.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'src/ingestion-api/**'
      - 'src/shared/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run linting
        run: uv run ruff check src/ingestion-api

      - name: Run type checking
        run: uv run mypy src/ingestion-api

      - name: Run unit tests
        run: uv run pytest src/ingestion-api/tests --cov=src/ingestion-api

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/ingestion-api
          push: false
          tags: ingestion-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
