name: CD - Deploy to Dev

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - '.github/workflows/cd-dev.yml'

env:
  PROJECT_ID: drone-fleet-optimizer-dev
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev

jobs:
  deploy-ingestion-api:
    if: contains(github.event.head_commit.modified, 'src/ingestion-api')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/drone-fleet-optimizer/ingestion-api"
          TAG="dev-${{ github.sha }}"

          docker build -t $IMAGE:$TAG -t $IMAGE:latest-dev \
            -f src/ingestion-api/Dockerfile \
            --build-arg ENVIRONMENT=dev \
            .

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest-dev

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ingestion-api \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/drone-fleet-optimizer/ingestion-api:dev-${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --service-account ingestion-api@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars ENVIRONMENT=dev,PROJECT_ID=${{ env.PROJECT_ID }} \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --cpu 1 \
            --allow-unauthenticated \
            --quiet

      - name: Output Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ingestion-api \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Ingestion API deployed to: $SERVICE_URL"

  deploy-state-manager:
    if: contains(github.event.head_commit.modified, 'src/state-manager')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          cd src/state-manager
          ./gradlew build -x test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/drone-fleet-optimizer/state-manager"
          TAG="dev-${{ github.sha }}"

          docker build -t $IMAGE:$TAG -t $IMAGE:latest-dev \
            -f src/state-manager/Dockerfile \
            --build-arg ENVIRONMENT=dev \
            src/state-manager

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest-dev

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy state-manager \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/drone-fleet-optimizer/state-manager:dev-${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --service-account state-manager@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars ENVIRONMENT=dev,PROJECT_ID=${{ env.PROJECT_ID }},SPRING_PROFILES_ACTIVE=dev \
            --min-instances 0 \
            --max-instances 3 \
            --memory 1Gi \
            --cpu 2 \
            --no-allow-unauthenticated \
            --quiet
