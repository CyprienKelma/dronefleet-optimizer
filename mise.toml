experimental_monorepo_root = true

[monorepo]
config_roots = [
  "infrastructure/*/",
  "services/*/",
  "shared/*/",
  "libs/*/*",
]

[settings]
python.uv_venv_auto = true

[tools]
uv = "0.5.11"
python = "3.11"
java = "temurin-21"
## infra
terraform = "1.9.0"
## cli
gcloud = "latest"
## linters
prettier = "latest"
node = "latest"
gradle = "8.5"

[env]
MISE_PROJECT_ROOT = "{{config_root}}"
# Default to local development
DEPLOYMENT_STRATEGY = "on_cloud"
PROJECT_ID = "drone-fleet-optimizer-local"
PYTHONPATH = "src"
# Automatic virtualenv activation
_.python.venv = { path = ".venv", create = true }
_.file = [{ path = ".env" }, "config/{{env.ENVIRONMENT}}.env"]
# Local emulators
PUBSUB_EMULATOR_HOST = "localhost:8085"
FIRESTORE_EMULATOR_HOST = "localhost:8080"

# --- Project Setup ---
[tasks.init]
description = "Initialize project: create venv and sync dependencies"
run = ["uv venv", "uv sync"]

[tasks.clean]
description = "Clean project: remove venv and cache files"
run = "rm -rf .venv __pycache__ **/__pycache__ **/*.pyc"

# --- Testing (repo-level) ---
[tasks."test:unit"]
description = "Run unit tests"
run = "uv run pytest tests/unit -v"

[tasks."test:integration"]
description = "Run integration tests"
run = "uv run pytest tests/integration -v"

[tasks."test:e2e"]
description = "Run end-to-end tests"
run = "uv run pytest tests/e2e -v"

[tasks."test:coverage"]
description = "Run tests with coverage report"
run = "uv run pytest --cov=src --cov-report=html"

[tasks."test:all"]
description = "Run all tests"
depends = ["test:unit", "test:integration", "test:e2e"]

# --- Lint Aggregator ---
[tasks."lint:all"]
description = "Run all linters across the monorepo"
depends = [
  "//services/injestion:lint",
  "//services/path_optimizer:lint",
  "//services/state_manager:lint",
]
run = { task = "//...:lint" }

[tasks."format:all"]
description = "Run all formatters across the monorepo"
run = { task = "//...:format" }
